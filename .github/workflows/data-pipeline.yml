name: Data Pipeline

on:
  schedule:
    # SOURCE CADENCE: ASIC republishes the Financial Advisers Register MONTHLY
    # (the CKAN resource keeps a stable id while the filename rolls to
    # financial_advisers_YYYYMM.csv). Monthly is therefore proportional to the
    # source, and is also the fastest cadence this factory permits.
    # Day 9 at 04:23 UTC — staggered so sibling repos do not all fire together.
    - cron: '23 4 9 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The pipeline is deliberately dependency-free, so there is nothing to
      # install for it — only the repo's own devDependencies, which it does not
      # need. `node pipeline/collect.mjs` runs on a bare Node 20.
      - name: Collect and reconcile
        run: node pipeline/collect.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update register data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
